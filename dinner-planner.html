// ========================================
// PWA Service Worker Registration
// ========================================
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('./service-worker.js')
      .then(reg => console.log('Service Worker registered:', reg.scope))
      .catch(err => console.log('Service Worker registration failed:', err));
  });
}

// PWA Install Prompt
let deferredPrompt;
const installPrompt = document.getElementById('installPrompt');
const installBtn = document.getElementById('installBtn');
const dismissBtn = document.getElementById('dismissBtn');

window.addEventListener('beforeinstallprompt', (e) => {
  // Prevent Chrome 67 and earlier from automatically showing the prompt
  e.preventDefault();
  // Stash the event so it can be triggered later
  deferredPrompt = e;
  // Show the install prompt
  installPrompt.classList.add('show');
});

installBtn.addEventListener('click', async () => {
  if (!deferredPrompt) return;
  // Show the install prompt
  deferredPrompt.prompt();
  // Wait for the user to respond to the prompt
  const { outcome } = await deferredPrompt.userChoice;
  console.log(`User response to the install prompt: ${outcome}`);
  // Clear the deferredPrompt
  deferredPrompt = null;
  // Hide the install prompt
  installPrompt.classList.remove('show');
});

dismissBtn.addEventListener('click', () => {
  installPrompt.classList.remove('show');
  // Optionally remember user dismissed
  localStorage.setItem('installDismissed', 'true');
});

// Check if user previously dismissed
if (localStorage.getItem('installDismissed') === 'true') {
  installPrompt.classList.remove('show');
}

// Listen for app installed
window.addEventListener('appinstalled', (evt) => {
  console.log('App was installed');
  installPrompt.classList.remove('show');
});

// ========================================
// GET ACTIVE DISHES (default - hidden + custom)
// ========================================
function getActiveDishes(cat) {
  const defaults = {main:DEFAULT_MAINS,side:DEFAULT_SIDES,soup:DEFAULT_SOUPS,grain:DEFAULT_GRAINS};
  const key = cat === "side" ? "sides" : cat === "soup" ? "soups" : cat === "grain" ? "grains" : "mains";
  const hidden = hiddenDishes[key] || [];
  const customs = (customDishes[key] || []).map(d => ({...d, _custom:true}));
  return [...defaults[cat].filter(d => !hidden.includes(d.name)), ...customs];
}

function getAllDishes(cat) {
  const defaults = {main:DEFAULT_MAINS,side:DEFAULT_SIDES,soup:DEFAULT_SOUPS,grain:DEFAULT_GRAINS};
  const key = cat === "side" ? "sides" : cat === "soup" ? "soups" : cat === "grain" ? "grains" : "mains";
  const hidden = hiddenDishes[key] || [];
  const customs = (customDishes[key] || []).map(d => ({...d, _custom:true}));
  return [...defaults[cat].map(d => ({...d, _hidden:hidden.includes(d.name)})), ...customs];
}

function isActive(cat, name) {
  return getActiveDishes(cat).some(d => d.name === name);
}

// ========================================
// DATE HELPERS
// ========================================
function dateKey(d) {
  return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
}
function dateDisplay(d) {
  const today = new Date(); today.setHours(0,0,0,0);
  const diff = Math.round((d - today) / 86400000);
  const wd = ["周日","周一","周二","周三","周四","周五","周六"][d.getDay()];
  const label = `${d.getMonth()+1}月${d.getDate()}日 ${wd}`;
  if (diff === 0) return label + "（今天）";
  if (diff === 1) return label + "（明天）";
  if (diff === -1) return label + "（昨天）";
  return label;
}

// ========================================
// MENU GENERATION ENGINE
// ========================================
function getRecentDishes(days) {
  const used = {main:[],side:[],soup:[],grain:[]};
  for (let i = 1; i <= days; i++) {
    const d = new Date(currentDate); d.setDate(d.getDate() - i);
    const k = dateKey(d);
    if (savedMenus[k]) {
      const m = savedMenus[k];
      m.mains.forEach(n => used.main.push(n));
      m.sides.forEach(n => used.side.push(n));
      used.soup.push(m.soup);
      used.grain.push(m.grain);
    }
  }
  return used;
}

function getRecentProteinSrc(days) {
  const srcs = [];
  for (let i = 1; i <= days; i++) {
    const d = new Date(currentDate); d.setDate(d.getDate() - i);
    const k = dateKey(d);
    if (savedMenus[k]) {
      savedMenus[k].mains.forEach(name => {
        const dish = DEFAULT_MAINS.find(m => m.name === name) || (customDishes.mains||[]).find(m=>m.name===name);
        if (dish && dish.proteinSrc) srcs.push(dish.proteinSrc);
      });
    }
  }
  return srcs;
}

function pickFrom(arr, excludeNames, extraFilter) {
  let c = arr.filter(i => !excludeNames.includes(i.name));
  if (extraFilter) c = c.filter(extraFilter);
  if (c.length === 0) c = arr;
  return c[Math.floor(Math.random() * c.length)];
}

function generateFullMenu(exclude) {
  exclude = exclude || {};
  const allMains = getActiveDishes("main");
  const allSides = getActiveDishes("side");
  const allSoups = getActiveDishes("soup");
  const allGrains = getActiveDishes("grain");
  const recent = getRecentDishes(5);
  const recentProteinSrc = getRecentProteinSrc(3);

  // === MAIN DISH(ES) ===
  let mains = [];
  let mainCandidates = allMains.filter(m => !recent.main.includes(m.name));
  if (exclude.mains) mainCandidates = mainCandidates.filter(m => !exclude.mains.includes(m.name));
  let proteinFiltered = mainCandidates.filter(m => !recentProteinSrc.includes(m.proteinSrc));
  const mainPool = proteinFiltered.length > 0 ? proteinFiltered : mainCandidates;

  // For 1 person, prefer lighter mains
  if (dinerCount === 1) {
    let lightMains = mainPool.filter(m => !m.heavy);
    if (lightMains.length > 0) mains.push(lightMains[Math.floor(Math.random()*lightMains.length)]);
    else mains.push(mainPool[Math.floor(Math.random()*mainPool.length)]);
  } else {
    mains.push(mainPool[Math.floor(Math.random()*mainPool.length)]);
  }

  // === SIDE DISH(ES) ===
  let sideCount = dinerCount <= 2 ? 1 : 2;
  let sides = [];
  let sideRecent = recent.side.slice(0, 3);
  let usedSideNames = [...exclude.sides || []];

  for (let i = 0; i < sideCount; i++) {
    let sideCandidates = allSides.filter(s => !sideRecent.includes(s.name) && !usedSideNames.includes(s.name));
    const mainHasGreen = mains.some(m => m.tags.includes("veggie") && m.color === "green");
    if (mainHasGreen && i === 0) {
      let nonGreen = sideCandidates.filter(s => s.color !== "green");
      if (nonGreen.length > 0) sideCandidates = nonGreen;
    } else if (!mainHasGreen && i === 0) {
      let greenOnes = sideCandidates.filter(s => s.color === "green");
      if (greenOnes.length > 0 && Math.random() > 0.3) sideCandidates = greenOnes;
    }
    if (mains.some(m => m.heavy) && i === 0) {
      let lightSides = sideCandidates.filter(s => s.tags.includes("quick"));
      if (lightSides.length > 0) sideCandidates = lightSides;
    }
    // For 2nd side, ensure color diversity
    if (i === 1 && sides.length > 0) {
      let prevColor = sides[0].color;
      let diffColor = sideCandidates.filter(s => s.color !== prevColor);
      if (diffColor.length > 0) sideCandidates = diffColor;
    }
    if (sideCandidates.length === 0) sideCandidates = allSides.filter(s => !usedSideNames.includes(s.name));
    const picked = sideCandidates[Math.floor(Math.random()*sideCandidates.length)];
    if (picked) { sides.push(picked); usedSideNames.push(picked.name); }
  }

  // === SOUP ===
  let soupCandidates = allSoups.filter(s => !recent.soup.slice(0,3).includes(s.name));
  if (exclude.soup) soupCandidates = soupCandidates.filter(s => s.name !== exclude.soup);
  if (mains.some(m => m.heavy)) {
    let lightSoups = soupCandidates.filter(s => s.tags.includes("light"));
    if (lightSoups.length > 0) soupCandidates = lightSoups;
  }
  if (mains.some(m => m.flavor==="辣"||m.flavor==="微辣")) {
    let nonSpicy = soupCandidates.filter(s => s.flavor!=="辣" && s.flavor!=="微辣");
    if (nonSpicy.length > 0) soupCandidates = nonSpicy;
  }
  if (soupCandidates.length === 0) soupCandidates = allSoups;
  const soup = soupCandidates[Math.floor(Math.random()*soupCandidates.length)];

  // === GRAIN ===
  let grainCandidates = allGrains.filter(g => !recent.grain.slice(0,3).includes(g.name));
  if (exclude.grain) grainCandidates = grainCandidates.filter(g => g.name !== exclude.grain);
  if (mains.some(m => m.flavor==="清淡") && Math.random()>0.5) {
    let mixed = grainCandidates.filter(g => g.grain==="mixed");
    if (mixed.length > 0) grainCandidates = mixed;
  }
  if (grainCandidates.length === 0) grainCandidates = allGrains;
  const grain = grainCandidates[Math.floor(Math.random()*grainCandidates.length)];

  return { mains, sides, soup, grain };
}

function calcNutrition(menu) {
  let p = 0, v = 0, s = 0;
  menu.mains.forEach(m => {
    if (m.tags.includes("protein")) p += dinerCount <= 1 ? 40 : 45;
    if (m.proteinSrc && ["beef","pork","fish"].includes(m.proteinSrc)) p += 15;
    else if (m.proteinSrc==="chicken") p += 10;
    else if (m.proteinSrc==="seafood") p += 12;
    else if (m.proteinSrc==="tofu") p += 8;
    else if (m.proteinSrc==="egg") p += 6;
    if (m.proteinSrc) p += 5;
  });
  if (menu.soup.tags.includes("protein")) p += 8;
  p = Math.min(100, p);

  menu.mains.forEach(m => { if (m.tags.includes("veggie")) v += 12; });
  v += menu.sides.length * 25;
  menu.sides.forEach(si => { if (si.tags.includes("quick")) v += 8; });
  v += 12;
  if (menu.grain.tags.includes("veggie")) v += 8;
  v = Math.min(100, v);

  s = menu.grain.tags.includes("mixed")||menu.grain.grain==="mixed" ? 72 : 68;
  if (menu.mains.some(m => m.tags.includes("staple"))) s += 8;
  s = Math.min(100, s);

  return { protein:Math.round(p), veggie:Math.round(v), staple:Math.round(s) };
}

function totalCombos() {
  const m = getActiveDishes("main").length;
  const s = getActiveDishes("side").length;
  const sp = getActiveDishes("soup").length;
  const g = getActiveDishes("grain").length;
  let sidesCount = dinerCount <= 2 ? s : s * Math.max(1, s-1);
  return m * sidesCount * sp * g;
}

function renderTags(tags) {
  return tags.map(t => {
    const info = TAG_MAP[t]; if (!info) return '';
    return `<span class="tag ${info.cls}">${info.label}</span>`;
  }).join('');
}

      </div>
      <button class="item-swap-btn" onclick="swapOne('side',${i})">换配菜</button>

  items.push(`<div class="menu-item">
    <div class="item-info">
      <div class="item-name">🍲 ${menu.soup.name} <span style="font-size:12px;color:#b4b2a9;font-weight:400;">汤</span>${menu.soup._custom?'<span style="font-size:10px;color:#534AB7;border:1px solid #AFA9EC;background:#EEEDFE;padding:1px 5px;border-radius:10px;margin-left:6px;">自选</span>':''}</div>
      <div class="item-desc">${menu.soup.desc}</div>
      <div class="item-tags">${renderTags(menu.soup.tags)}</div>
    </div>
    <button class="item-swap-btn" onclick="swapOne('soup',0)">换汤</button>
  </div>`);

  items.push(`<div class="menu-item">
    <div class="item-info">
      <div class="item-name">🍚 ${menu.grain.name} <span style="font-size:12px;color:#b4b2a9;font-weight:400;">主食</span>${menu.grain._custom?'<span style="font-size:10px;color:#534AB7;border:1px solid #AFA9EC;background:#EEEDFE;padding:1px 5px;border-radius:10px;margin-left:6px;">自选</span>':''}</div>
      <div class="item-desc">${menu.grain.desc}</div>
      <div class="item-tags">${renderTags(menu.grain.tags)}</div>
    </div>
    <button class="item-swap-btn" onclick="swapOne('grain',0)">换主食</button>
  </div>`);

  return items.join('');
}

function renderNutrition(nut) {
  const bars = [
    {label:"蛋白质",value:nut.protein,fill:"nut-fill-protein"},
    {label:"蔬菜",value:nut.veggie,fill:"nut-fill-veggie"},
    {label:"主食",value:nut.staple,fill:"nut-fill-staple"}
  ];
  const score = Math.round((nut.protein+nut.veggie+nut.staple)/3);
  let scoreColor = score>=68?"#0F6E56":score>=55?"#BA7517":"#E24B4A";
  let scoreText = score>=68?"营养均衡":score>=55?"基本达标":"建议加蔬菜";
  return `<div style="background:#fff;border-radius:16px;border:.5px solid rgba(0,0,0,.12);padding:16px 20px;">
    <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:12px;">
      <span style="font-size:13px;color:#888780;">营养评估</span>
      <span style="font-size:13px;font-weight:500;color:${scoreColor};">${scoreText}</span>
    </div>
    ${bars.map(b=>`<div class="nut-row"><span class="nut-label">${b.label}</span><div class="nut-track"><div class="nut-fill ${b.fill}" style="width:${b.value}%"></div></div><span class="nut-value">${b.value}%</span></div>`).join('')}
  </div>`;
}

function updateUI() {
  document.getElementById("dateLabel").textContent = dateDisplay(currentDate);
  const key = dateKey(currentDate);

  // diner buttons
  document.querySelectorAll(".diner-btn").forEach(b => {
    b.classList.toggle("active", parseInt(b.dataset.n) === dinerCount);
  });

  if (savedMenus[key]) {
    const s = savedMenus[key];
    currentMenu.mains = s.mains.map(n => [...DEFAULT_MAINS,...(customDishes.mains||[])].find(d=>d.name===n)).filter(Boolean);
    currentMenu.sides = s.sides.map(n => [...DEFAULT_SIDES,...(customDishes.sides||[])].find(d=>d.name===n)).filter(Boolean);
    currentMenu.soup = [...DEFAULT_SOUPS,...(customDishes.soups||[])].find(d=>d.name===s.soup) || DEFAULT_SOUPS[0];
    currentMenu.grain = [...DEFAULT_GRAINS,...(customDishes.grains||[])].find(d=>d.name===s.grain) || DEFAULT_GRAINS[0];
    if (s.diners) dinerCount = s.diners;
  } else if (!currentMenu.mains.length) {
    currentMenu = generateFullMenu();
  }

  const mc = document.getElementById("menuContent");
  mc.innerHTML = renderMenu(currentMenu);
  mc.classList.remove("fade-in"); void mc.offsetWidth; mc.classList.add("fade-in");

  document.getElementById("nutritionBar").innerHTML = renderNutrition(calcNutrition(currentMenu));
  document.getElementById("comboCount").textContent = `${totalCombos().toLocaleString()} 种搭配 · ${getActiveDishes("main").length}道主菜 / ${getActiveDishes("side").length}道配菜 / ${getActiveDishes("soup").length}道汤 / ${getActiveDishes("grain").length}种主食`;

  const badge = document.getElementById("savedBadge");
  if (savedMenus[key]) { badge.textContent="已保存这一天的菜单"; badge.style.display="block"; }
  else { badge.style.display="none"; }
}

// ========================================
// INTERACTIONS
// ========================================
function setDiners(n) {
  dinerCount = n;
  localStorage.setItem("dinnerDiners", String(n));
  const key = dateKey(currentDate);
  if (!savedMenus[key]) {
    currentMenu = generateFullMenu();
  }
  updateUI();
}

function swapOne(cat, idx) {
  const dKey = dateKey(currentDate);
  if (savedMenus[dKey]) { alert("这天已确认菜单，不能更换。"); return; }

  const exclude = {
    mains: currentMenu.mains.map(d=>d.name),
    sides: currentMenu.sides.map(d=>d.name),
    soup: currentMenu.soup.name,
    grain: currentMenu.grain.name
  };

  const newMenu = generateFullMenu(exclude);

  if (cat === "main") {
    currentMenu.mains[idx] = newMenu.mains[0];
  } else if (cat === "side") {
    let newSide = newMenu.sides.find(s => !currentMenu.sides.some(cs => cs.name === s.name));
    if (!newSide) newSide = newMenu.sides[0];
    currentMenu.sides[idx] = newSide;
  } else if (cat === "soup") {
    currentMenu.soup = newMenu.soup;
  } else if (cat === "grain") {
    currentMenu.grain = newMenu.grain;
  }

  const mc = document.getElementById("menuContent");
  mc.classList.add("shake");
  setTimeout(()=>mc.classList.remove("shake"),400);
  setTimeout(()=>{
    mc.innerHTML = renderMenu(currentMenu);
    mc.classList.remove("fade-in"); void mc.offsetWidth; mc.classList.add("fade-in");
    document.getElementById("nutritionBar").innerHTML = renderNutrition(calcNutrition(currentMenu));
  },200);
}

function rerollAll() {
  const dKey = dateKey(currentDate);
  if (savedMenus[dKey]) { alert("这天已确认菜单，不能更换。"); return; }
  currentMenu = generateFullMenu({
    mains: currentMenu.mains.map(d=>d.name),
    sides: currentMenu.sides.map(d=>d.name),
    soup: currentMenu.soup.name,
    grain: currentMenu.grain.name
  });
  const mc = document.getElementById("menuContent");
  mc.classList.add("shake");
  setTimeout(()=>mc.classList.remove("shake"),400);
  setTimeout(()=>{
    mc.innerHTML = renderMenu(currentMenu);
    mc.classList.remove("fade-in"); void mc.offsetWidth; mc.classList.add("fade-in");
    document.getElementById("nutritionBar").innerHTML = renderNutrition(calcNutrition(currentMenu));
  },200);
}

function changeDate(delta) {
  const d = new Date(currentDate); d.setDate(d.getDate()+delta);
  currentDate = d;
  currentMenu = { mains:[], sides:[], soup:null, grain:null };
  updateUI();
}

function saveMenu() {
  const key = dateKey(currentDate);
  savedMenus[key] = {
    mains: currentMenu.mains.map(d=>d.name),
    sides: currentMenu.sides.map(d=>d.name),
    soup: currentMenu.soup.name,
    grain: currentMenu.grain.name,
    diners: dinerCount
  };
  localStorage.setItem("dinnerHistory_v2", JSON.stringify(savedMenus));
  const badge = document.getElementById("savedBadge");
  badge.textContent = "已保存！这天就吃这个了";

  badge.style.display = "block";
}

function showHistory() {
  const section = document.getElementById("historySection");
  section.style.display = section.style.display==="none"?"block":"none";
  if (section.style.display==="block") renderHistory();
}

function renderHistory() {
  const list = document.getElementById("historyList");
  const entries = Object.entries(savedMenus).sort((a,b)=>b[0].localeCompare(a[0])).slice(0,7);
  if (!entries.length) { list.innerHTML='<li style="color:#b4b2a9;justify-content:center;">暂无记录</li>'; return; }
  list.innerHTML = entries.map(([date,info]) => {
    const parts = info.mains.join("+") + " / " + info.sides.join("+") + " / " + info.soup;
    const diners = info.diners ? `<span class="h-diners">${info.diners}人</span>` : '';
    return `<li><span class="h-date">${date}${diners}</span><span class="h-menu">${parts}</span></li>`;
  }).join('');
}

// ========================================
// MANAGE PANEL
// ========================================
function toggleManage() {
  document.getElementById("managePanel").classList.toggle("open");
  if (document.getElementById("managePanel").classList.contains("open")) {
    renderManageList();
  }
}

function switchTab(cat) {
  manageTab = cat;
  addFormTags = [];
  document.querySelectorAll(".mp-tab").forEach(t => t.classList.toggle("active", t.dataset.cat===cat));
  renderManageList();
  renderAddForm();
}

function renderManageList() {
  const cat = manageTab;
  const dishes = getAllDishes(cat);
  const key = cat==="side"?"sides":cat==="soup"?"soups":cat==="grain"?"grains":"mains";
  const list = document.getElementById("mpDishList");
  list.innerHTML = dishes.map((d,i) => {
    const isOn = !d._hidden;
    const isCustom = !!d._custom;
    return `<div class="mp-dish">
      <div class="mp-dish-info">
        <div class="mp-dish-name ${isOn?'':'hidden-dish'}">${d.name}${isCustom?'<span class="custom-badge">自定义</span>':''}</div>
        <div class="mp-dish-desc">${d.desc}</div>
      </div>
      ${isCustom ? `<button class="mp-del-btn" onclick="deleteCustom('${key}',${i})">删除</button>` : `<button class="mp-toggle ${isOn?'on':'off'}" onclick="toggleDish('${key}','${d.name}',this)"></button>`}
    </div>`;
  }).join('');
}

function toggleDish(key, name, btn) {
  const hidden = hiddenDishes[key];
  const idx = hidden.indexOf(name);
  if (idx >= 0) hidden.splice(idx, 1);
  else hidden.push(name);
  localStorage.setItem("dinnerHidden", JSON.stringify(hiddenDishes));
  btn.classList.toggle("on", idx < 0);
  btn.classList.toggle("off", idx >= 0);
  const nameEl = btn.closest(".mp-dish").querySelector(".mp-dish-name");
  nameEl.classList.toggle("hidden-dish", idx < 0);
  document.getElementById("comboCount").textContent = `${totalCombos().toLocaleString()} 种搭配 · ${getActiveDishes("main").length}道主菜 / ${getActiveDishes("side").length}道配菜 / ${getActiveDishes("soup").length}道汤 / ${getActiveDishes("grain").length}种主食`;
}

function deleteCustom(key, idx) {
  if (!confirm("确定删除这个自定义菜品？")) return;
  customDishes[key].splice(idx, 1);
  localStorage.setItem("dinnerCustom", JSON.stringify(customDishes));
  renderManageList();
  document.getElementById("comboCount").textContent = `${totalCombos().toLocaleString()} 种搭配 · ${getActiveDishes("main").length}道主菜 / ${getActiveDishes("side").length}道配菜 / ${getActiveDishes("soup").length}道汤 / ${getActiveDishes("grain").length}种主食`;
}

function renderAddForm() {
  const cat = manageTab;
  const extra = document.getElementById("addExtraFields");

  if (cat === "main") {
    extra.innerHTML = `
      <div style="display:flex;gap:10px;">
        <div class="mp-field" style="flex:1"><label>蛋白质来源</label>
          <select id="addProteinSrc">
            <option value="chicken">鸡肉</option><option value="pork">猪肉</option>
            <option value="beef">牛肉</option><option value="fish">鱼</option>
            <option value="seafood">海鲜/虾</option><option value="tofu">豆腐</option>
            <option value="egg">鸡蛋</option>
          </select>
        </div>
        <div class="mp-field" style="flex:1"><label>口味</label>
          <select id="addFlavor">
            <option value="咸鲜">咸鲜</option><option value="酸甜">酸甜</option>
            <option value="甜">甜</option><option value="辣">辣</option>
            <option value="微辣">微辣</option><option value="清淡">清淡</option>
            <option value="浓郁">浓郁</option><option value="蒜香">蒜香</option>
          </select>
        </div>
      </div>
      <div style="display:flex;gap:10px;">
        <div class="mp-field" style="flex:1"><label>颜色特征</label>
          <select id="addColor">
            <option value="brown">棕/深色</option><option value="red">红色</option>
            <option value="green">绿色</option><option value="yellow">黄色</option>
            <option value="white">白色</option><option value="orange">橙色</option>
          </select>
        </div>
        <div class="mp-field" style="flex:1"><label>是否重口</label>
          <select id="addHeavy">
            <option value="false">清淡</option><option value="true">重口</option>
          </select>
        </div>
      </div>`;
  } else if (cat === "side") {
    extra.innerHTML = `
      <div style="display:flex;gap:10px;">
        <div class="mp-field" style="flex:1"><label>颜色特征</label>
          <select id="addColor">
            <option value="green">绿色</option><option value="white">白色</option>
            <option value="yellow">黄色</option><option value="orange">橙色</option>
            <option value="black">黑色</option><option value="purple">紫色</option>
            <option value="mixed">混合</option>
          </select>
        </div>
      </div>`;
  } else {
    extra.innerHTML = '';
  }

  // Tags
  const tagOpts = cat==="main"?["protein","veggie"]:
                  cat==="side"?["veggie","protein","quick","staple"]:
                  cat==="soup"?["light","protein","staple"]:
                  ["staple","veggie","light"];
  document.getElementById("addTags").innerHTML = tagOpts.map(t =>
    `<button class="mp-tag-opt" data-tag="${t}" onclick="toggleAddTag(this,'${t}')">${TAG_MAP[t]?TAG_MAP[t].label:t}</button>`
  ).join('');
}

function toggleAddTag(btn, tag) {
  const idx = addFormTags.indexOf(tag);
  if (idx >= 0) { addFormTags.splice(idx,1); btn.classList.remove("sel"); }
  else { addFormTags.push(tag); btn.classList.add("sel"); }
}

function addCustomDish() {
  const name = document.getElementById("addName").value.trim();
  const desc = document.getElementById("addDesc").value.trim();
  if (!name) { alert("请输入菜品名称"); return; }
  if (!desc) { alert("请输入菜品简介"); return; }

  const cat = manageTab;
  const key = cat==="side"?"sides":cat==="soup"?"soups":cat==="grain"?"grains":"mains";
  if (!customDishes[key]) customDishes[key] = [];

  let dish = { name, desc, tags:[...addFormTags,"custom"] };

  if (cat === "main") {
    dish.proteinSrc = document.getElementById("addProteinSrc")?.value || "tofu";
    dish.flavor = document.getElementById("addFlavor")?.value || "咸鲜";
    dish.color = document.getElementById("addColor")?.value || "brown";
    dish.heavy = document.getElementById("addHeavy")?.value === "true";
  } else if (cat === "side") {
    dish.vegType = "custom";
    dish.color = document.getElementById("addColor")?.value || "green";
  } else if (cat === "grain") {
    dish.grain = "custom";
  }

  customDishes[key].push(dish);
  localStorage.setItem("dinnerCustom", JSON.stringify(customDishes));

  // Reset form
  document.getElementById("addName").value = "";
  document.getElementById("addDesc").value = "";
  addFormTags = [];
  document.querySelectorAll(".mp-tag-opt").forEach(b => b.classList.remove("sel"));

  renderManageList();
  document.getElementById("comboCount").textContent = `${totalCombos().toLocaleString()} 种搭配 · ${getActiveDishes("main").length}道主菜 / ${getActiveDishes("side").length}道配菜 / ${getActiveDishes("soup").length}道汤 / ${getActiveDishes("grain").length}种主食`;
}

// ========================================
// INIT
// ========================================
updateUI();
</script>
</body>
</html>
