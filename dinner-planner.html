<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>三餐帮手 · 今天吃什么</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB",sans-serif;background:#f5f3ee;min-height:100vh;padding:20px 16px 60px;color:#2c2c2a}
  .app-header{text-align:center;margin-bottom:16px}
  .app-header h1{font-size:22px;font-weight:500;color:#2c2c2a;letter-spacing:.5px}
  .app-header p{font-size:13px;color:#888780;margin-top:4px}

  /* meal tabs */
  .meal-tabs{max-width:520px;margin:0 auto 16px;display:flex;gap:8px;background:#fff;border-radius:14px;border:.5px solid rgba(0,0,0,.12);padding:5px}
  .meal-tab{flex:1;text-align:center;padding:9px 0;border-radius:10px;font-size:14px;color:#5f5e5a;cursor:pointer;transition:all .18s;border:none;background:transparent}
  .meal-tab.active{background:#534AB7;color:#fff;font-weight:500}
  .meal-tab:not(.active):hover{background:#EEEDFE;color:#534AB7}

  /* brain tip */
  .brain-tip{max-width:520px;margin:0 auto 14px;background:linear-gradient(135deg,#EEEDFE 0%,#E6F1FB 100%);border-radius:12px;padding:12px 14px;border:.5px solid rgba(83,74,183,.18)}
  .brain-tip-title{font-size:12px;font-weight:500;color:#3C3489;margin-bottom:5px;display:flex;align-items:center;gap:5px}
  .brain-tip p{font-size:11.5px;color:#534AB7;line-height:1.65;opacity:.9}

  /* date nav */
  .date-nav{display:flex;align-items:center;justify-content:center;gap:16px;margin-bottom:16px}
  .date-nav .date-label{font-size:15px;font-weight:500;color:#3C3489;min-width:120px;text-align:center}
  .date-nav button{background:transparent;border:.5px solid #b4b2a9;border-radius:8px;padding:6px 14px;font-size:13px;cursor:pointer;color:#5f5e5a;transition:border-color .15s}
  .date-nav button:hover{border-color:#534AB7;color:#534AB7}

  /* controls bar */
  .controls-bar{max-width:520px;margin:0 auto 16px;display:flex;gap:10px;align-items:stretch}
  .ctrl-group{flex:1;background:#fff;border-radius:16px;border:.5px solid rgba(0,0,0,.12);padding:14px 16px}
  .ctrl-label{font-size:11px;color:#b4b2a9;margin-bottom:8px;display:flex;align-items:center;gap:5px}
  .ctrl-label svg{width:13px;height:13px}
  .diner-btns{display:flex;gap:6px}
  .diner-btn{width:42px;height:38px;border-radius:10px;border:.5px solid rgba(0,0,0,.12);background:transparent;font-size:15px;font-weight:500;color:#5f5e5a;cursor:pointer;transition:all .15s}
  .diner-btn.active{background:#534AB7;color:#fff;border-color:#534AB7}
  .diner-btn:hover:not(.active){border-color:#534AB7;color:#534AB7}
  .diner-hint{font-size:10px;color:#b4b2a9;margin-top:6px;line-height:1.3}

  .manage-btn{width:100%;background:transparent;border:.5px solid rgba(0,0,0,.12);border-radius:10px;padding:8px 0;font-size:13px;color:#5f5e5a;cursor:pointer;transition:all .15s;display:flex;align-items:center;justify-content:center;gap:5px}
  .manage-btn:hover{border-color:#534AB7;color:#534AB7;background:#EEEDFE}

  /* combo count */
  .combo-count{text-align:center;font-size:11px;color:#b4b2a9;margin-bottom:6px}

  /* card */
  .card{background:#fff;border-radius:16px;border:.5px solid rgba(0,0,0,.12);padding:20px;margin-bottom:16px;max-width:520px;margin-left:auto;margin-right:auto}
  .menu-item{display:flex;align-items:flex-start;justify-content:space-between;padding:12px 0;border-bottom:.5px solid rgba(0,0,0,.07)}
  .menu-item:last-child{border-bottom:none;padding-bottom:0}
  .menu-item:first-child{padding-top:0}
  .item-info{flex:1;min-width:0}
  .item-name{font-size:15px;font-weight:500;color:#2c2c2a}
  .item-desc{font-size:12px;color:#888780;margin-top:3px;line-height:1.5}
  .item-tags{display:flex;gap:5px;margin-top:6px;flex-wrap:wrap}
  .tag{font-size:11px;padding:2px 8px;border-radius:20px;border:.5px solid}
  .tag-protein{color:#993C1D;border-color:#F0997B;background:#FAECE7}
  .tag-veggie{color:#0F6E56;border-color:#5DCAA5;background:#E1F5EE}
  .tag-light{color:#185FA5;border-color:#85B7EB;background:#E6F1FB}
  .tag-staple{color:#854F0B;border-color:#EF9F27;background:#FAEEDA}
  .tag-quick{color:#3B6D11;border-color:#97C459;background:#EAF3DE}
  .tag-iron{color:#71243B;border-color:#F4C0D1;background:#FBEAF0}
  .tag-custom{color:#534AB7;border-color:#AFA9EC;background:#EEEDFE}
  .tag-slowcarb{color:#854F0B;border-color:#EF9F27;background:#FAEEDA}
  .tag-choline{color:#3C3489;border-color:#AFA9EC;background:#EEEDFE}
  .tag-omega3{color:#185FA5;border-color:#85B7EB;background:#E6F1FB}
  .tag-antiox{color:#0F6E56;border-color:#5DCAA5;background:#E1F5EE}
  .item-swap-btn{background:transparent;border:.5px solid rgba(0,0,0,.15);border-radius:8px;padding:5px 12px;font-size:12px;color:#888780;cursor:pointer;white-space:nowrap;margin-left:12px;margin-top:2px;flex-shrink:0;transition:all .15s;align-self:center}
  .item-swap-btn:hover{border-color:#534AB7;color:#534AB7;background:#EEEDFE}
  .refresh-btn{width:100%;background:transparent;border:.5px solid rgba(0,0,0,.15);border-radius:10px;padding:9px 0;font-size:13px;color:#5f5e5a;cursor:pointer;margin-top:8px;transition:all .15s}
  .refresh-btn:hover{border-color:#534AB7;color:#534AB7;background:#EEEDFE}

  /* nutrition */
  .nutrition-bar{max-width:520px;margin:0 auto 16px}
  .nut-row{display:flex;align-items:center;gap:10px;margin-bottom:8px}
  .nut-label{font-size:12px;color:#888780;width:62px;flex-shrink:0}
  .nut-track{flex:1;height:6px;background:rgba(0,0,0,.07);border-radius:3px;overflow:hidden}
  .nut-fill{height:100%;border-radius:3px;transition:width .5s ease}
  .nut-fill-protein{background:#E24B4A}
  .nut-fill-veggie{background:#1D9E75}
  .nut-fill-staple{background:#BA7517}
  .nut-fill-slowcarb{background:#BA7517}
  .nut-fill-choline{background:#534AB7}
  .nut-fill-omega3{background:#185FA5}
  .nut-fill-antiox{background:#1D9E75}
  .nut-value{font-size:12px;color:#5f5e5a;width:35px;text-align:right;flex-shrink:0}
  .nut-hint{font-size:11px;color:#BA7517;margin-top:8px;line-height:1.5}

  /* action row */
  .action-row{max-width:520px;margin:0 auto;display:flex;gap:10px}
  .btn-primary{flex:1;padding:13px 0;background:#534AB7;color:#fff;border:none;border-radius:12px;font-size:14px;font-weight:500;cursor:pointer;transition:background .15s}
  .btn-primary:hover{background:#3C3489}
  .btn-secondary{padding:13px 20px;background:transparent;color:#534AB7;border:.5px solid #534AB7;border-radius:12px;font-size:14px;cursor:pointer;transition:all .15s}
  .btn-secondary:hover{background:#EEEDFE}
  .saved-badge{display:none;text-align:center;font-size:12px;color:#0F6E56;margin-top:10px;padding:6px;background:#E1F5EE;border-radius:8px;max-width:520px;margin-left:auto;margin-right:auto}
  .section-label{max-width:520px;margin:0 auto 10px;font-size:12px;color:#b4b2a9;letter-spacing:.5px;padding:0 2px}

  /* history */
  .history-card{max-width:520px;margin:0 auto 16px;background:#fff;border-radius:16px;border:.5px solid rgba(0,0,0,.12);padding:16px 20px}
  .history-title{font-size:13px;color:#888780;margin-bottom:12px}
  .history-list{list-style:none}
  .history-list li{display:flex;justify-content:space-between;align-items:flex-start;padding:8px 0;border-bottom:.5px solid rgba(0,0,0,.06);font-size:13px;gap:10px}
  .history-list li:last-child{border-bottom:none}
  .h-date{color:#888780;flex-shrink:0;font-size:12px}
  .h-meals{flex:1;text-align:right;font-size:12px}
  .h-meal-row{margin-bottom:4px}
  .h-meal-tag{color:#b4b2a9;margin-right:4px}
  .h-menu{color:#2c2c2a}

  /* manage panel */
  .manage-panel{max-width:520px;margin:0 auto 16px;background:#fff;border-radius:16px;border:.5px solid rgba(0,0,0,.12);padding:16px 20px;display:none}
  .manage-panel.open{display:block}
  .tool-row{display:flex;gap:8px;margin-top:14px}
  .tool-btn{flex:1;background:transparent;border:.5px solid rgba(0,0,0,.12);border-radius:10px;padding:9px 0;font-size:13px;color:#5f5e5a;cursor:pointer;transition:all .15s}
  .tool-btn:hover{border-color:#534AB7;color:#534AB7;background:#EEEDFE}
  .side-panel{max-width:520px;margin:16px auto;background:#fff;border-radius:16px;border:.5px solid rgba(0,0,0,.12);padding:16px 20px;display:none}
  .side-panel.open{display:block}
  .panel-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
  .panel-head b{font-size:14px;font-weight:500}
  .panel-close{font-size:12px;color:#b4b2a9;cursor:pointer}
  .sl-group-title{font-size:12px;color:#888780;margin:14px 0 4px;font-weight:500}
  .sl-item{display:flex;align-items:center;gap:8px;padding:7px 0;border-bottom:.5px solid rgba(0,0,0,.06);cursor:pointer;font-size:13px;color:#2C2C2A}
  .sl-item .dot{width:16px;height:16px;border-radius:4px;border:.5px solid rgba(0,0,0,.2);flex:0 0 16px;display:flex;align-items:center;justify-content:center;font-size:11px;color:#fff}
  .sl-item.checked .dot{background:#0F6E56;border-color:#0F6E56}
  .sl-item.checked .nm{text-decoration:line-through;color:#b4b2a9}
  .sl-item .from{font-size:11px;color:#b4b2a9;margin-left:auto;max-width:45%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .sl-actions{display:flex;gap:8px;margin-top:14px}
  .sl-actions button{flex:1;background:transparent;border:.5px solid rgba(0,0,0,.12);border-radius:10px;padding:9px 0;font-size:13px;color:#5f5e5a;cursor:pointer}
  .sl-actions button.primary{background:#534AB7;color:#fff;border-color:#534AB7}
  .panel-tip{font-size:11px;color:#b4b2a9;margin-top:10px;line-height:1.5}
  .share-img{width:100%;max-width:300px;border-radius:12px;border:.5px solid rgba(0,0,0,.12);display:block;margin:0 auto}
  .mp-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px}
  .mp-title{font-size:15px;font-weight:500}
  .mp-close{background:transparent;border:none;font-size:18px;color:#888780;cursor:pointer;padding:4px 8px;border-radius:6px}
  .mp-close:hover{background:rgba(0,0,0,.06)}
  .mp-tabs{display:flex;gap:0;border-bottom:1px solid rgba(0,0,0,.1);margin-bottom:16px;flex-wrap:wrap}
  .mp-tab{flex:1;text-align:center;padding:8px 4px;font-size:12.5px;color:#888780;cursor:pointer;border-bottom:2px solid transparent;transition:all .15s;min-width:60px}
  .mp-tab.active{color:#534AB7;border-bottom-color:#534AB7}
  .mp-dish-list{max-height:320px;overflow-y:auto;margin-bottom:14px}
  .mp-dish{display:flex;align-items:center;justify-content:space-between;padding:8px 0;border-bottom:.5px solid rgba(0,0,0,.05)}
  .mp-dish:last-child{border-bottom:none}
  .mp-dish-info{flex:1;min-width:0}
  .mp-dish-name{font-size:13px;font-weight:500}
  .mp-dish-name.hidden-dish{color:#b4b2a9;text-decoration:line-through}
  .mp-dish-desc{font-size:11px;color:#888780;margin-top:2px}
  .mp-dish-name .custom-badge{font-size:10px;color:#534AB7;border:1px solid #AFA9EC;background:#EEEDFE;padding:1px 5px;border-radius:10px;margin-left:6px;font-weight:400}
  .mp-toggle{width:38px;height:22px;border-radius:11px;border:none;cursor:pointer;position:relative;transition:background .2s;margin-right:10px;flex-shrink:0}
  .mp-toggle.on{background:#534AB7}
  .mp-toggle.off{background:#d3d1c7}
  .mp-toggle::after{content:'';position:absolute;top:2px;width:18px;height:18px;border-radius:50%;background:#fff;transition:left .2s}
  .mp-toggle.on::after{left:18px}
  .mp-toggle.off::after{left:2px}
  .mp-del-btn{background:transparent;border:none;color:#E24B4A;font-size:12px;cursor:pointer;padding:4px 6px;border-radius:4px;flex-shrink:0}
  .mp-del-btn:hover{background:#FCEBEB}
  .mp-add-form{border-top:1px solid rgba(0,0,0,.08);padding-top:14px}
  .mp-add-title{font-size:13px;font-weight:500;margin-bottom:10px;color:#2c2c2a}
  .mp-field{margin-bottom:10px}
  .mp-field label{font-size:12px;color:#888780;display:block;margin-bottom:4px}
  .mp-field input,.mp-field select{width:100%;padding:8px 10px;border:.5px solid rgba(0,0,0,.15);border-radius:8px;font-size:13px;color:#2c2c2a;background:#fff}
  .mp-field input:focus,.mp-field select:focus{outline:none;border-color:#534AB7}
  .mp-tags-row{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
  .mp-tag-opt{font-size:11px;padding:4px 10px;border-radius:14px;border:.5px solid rgba(0,0,0,.12);background:transparent;cursor:pointer;color:#5f5e5a;transition:all .15s}
  .mp-tag-opt.sel{background:#534AB7;color:#fff;border-color:#534AB7}
  .mp-submit{width:100%;padding:10px;background:#534AB7;color:#fff;border:none;border-radius:10px;font-size:13px;font-weight:500;cursor:pointer;margin-top:6px;transition:background .15s}
  .mp-submit:hover{background:#3C3489}

  .shake{animation:shake .4s ease}
  @keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
  .fade-in{animation:fadeIn .35s ease}
  @keyframes fadeIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}

  /* PWA install prompt */
  .install-prompt{display:none;position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid rgba(0,0,0,.1);padding:12px 16px;z-index:1000;box-shadow:0 -2px 10px rgba(0,0,0,.1)}
  .install-prompt.show{display:flex;align-items:center;justify-content:space-between;gap:12px}
  .install-prompt p{font-size:13px;color:#2c2c2a;flex:1}
  .install-btn{background:#534AB7;color:#fff;border:none;border-radius:8px;padding:8px 16px;font-size:13px;font-weight:500;cursor:pointer;white-space:nowrap}
  .install-dismiss{background:transparent;color:#888780;border:none;font-size:18px;cursor:pointer;padding:4px}
</style>
</head>
<body>

<!-- PWA Install Prompt -->
<div class="install-prompt" id="installPrompt">
  <p>📱 安装到桌面，像APP一样使用</p>
  <button class="install-btn" id="installBtn">安装</button>
  <button class="install-dismiss" id="dismissBtn">✕</button>
</div>

<div class="app-header">
  <h1>今天吃什么</h1>
  <p>三餐智能搭配 · 营养均衡 · 常换常新</p>
</div>

<div class="meal-tabs">
  <button class="meal-tab" data-meal="breakfast" onclick="setMeal('breakfast')">🌅 早餐</button>
  <button class="meal-tab" data-meal="lunch" onclick="setMeal('lunch')">☀️ 午餐</button>
  <button class="meal-tab" data-meal="dinner" onclick="setMeal('dinner')">🌙 晚餐</button>
</div>

<div class="brain-tip" id="brainTip" style="display:none;">
  <div class="brain-tip-title">🧠 黄翔博士 · 早餐「五大金刚」</div>
  <p id="brainTipText"></p>
</div>

<div class="date-nav">
  <button onclick="changeDate(-1)">‹ 前一天</button>
  <div class="date-label" id="dateLabel"></div>
  <button onclick="changeDate(1)">后一天 ›</button>
</div>

<div class="controls-bar">
  <div class="ctrl-group">
    <div class="ctrl-label">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>
      就餐人数
    </div>
    <div class="diner-btns" id="dinerBtns">
      <button class="diner-btn" data-n="1" onclick="setDiners(1)">1</button>
      <button class="diner-btn active" data-n="2" onclick="setDiners(2)">2</button>
      <button class="diner-btn" data-n="3" onclick="setDiners(3)">3</button>
      <button class="diner-btn" data-n="4" onclick="setDiners(4)">4</button>
    </div>
    <div class="diner-hint" id="dinerHint"></div>
  </div>
  <div class="ctrl-group" style="flex:0 0 120px;display:flex;flex-direction:column;justify-content:space-between;">
    <div class="ctrl-label">菜品管理</div>
    <button class="manage-btn" onclick="toggleManage()">编辑菜品库</button>
  </div>
</div>

<div class="combo-count" id="comboCount"></div>
<p class="section-label" id="menuSectionLabel">今日菜单</p>
<div class="card fade-in" id="menuCard">
  <div id="menuContent"></div>
  <div class="tool-row">
    <button class="tool-btn" onclick="toggleShopList()">买菜清单</button>
    <button class="tool-btn" onclick="toggleShareCard()">生成分享卡片</button>
  </div>
  <button class="refresh-btn" onclick="rerollAll()">全部换一套</button>
</div>
<div class="side-panel" id="shopPanel"></div>
<div class="side-panel" id="sharePanel"></div>

<p class="section-label">营养评估</p>
<div class="nutrition-bar" id="nutritionBar"></div>

<div class="action-row">
  <button class="btn-primary" onclick="saveMenu()">确定就吃这个</button>
  <button class="btn-secondary" onclick="showHistory()">历史记录</button>
</div>
<div class="saved-badge" id="savedBadge"></div>

<div id="historySection" style="display:none;margin-top:20px;">
  <p class="section-label">最近记录</p>
  <div class="history-card">
    <div class="history-title">近 7 天记录</div>
    <ul class="history-list" id="historyList"></ul>
  </div>
</div>

<!-- manage panel -->
<div class="manage-panel" id="managePanel">
  <div class="mp-header">
    <span class="mp-title" id="mpTitle">菜品库管理</span>
    <button class="mp-close" onclick="toggleManage()">✕</button>
  </div>
  <div class="mp-tabs" id="mpTabs"></div>
  <div class="mp-dish-list" id="mpDishList"></div>
  <div class="mp-add-form" id="mpAddForm">
    <div class="mp-add-title">添加自定义菜品</div>
    <div class="mp-field"><label>菜品名称</label><input id="addName" placeholder="如：外婆红烧肉"></div>
    <div class="mp-field"><label>简介</label><input id="addDesc" placeholder="如：奶奶的秘方，肥而不腻"></div>
    <div class="mp-field"><label>食材</label><input id="addIng" placeholder="如：五花肉、冰糖、生抽（逗号分隔，用于买菜清单）"></div>
    <label style="font-size:12px;color:#888780;display:block;margin-bottom:6px;">营养/特点标签</label>
    <div class="mp-tags-row" id="addTags"></div>
    <button class="mp-submit" onclick="addCustomDish()">添加到菜品库</button>
  </div>
</div>

<script>
// ========================================
// PWA Service Worker Registration
// ========================================
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('./service-worker.js')
      .then(reg => console.log('Service Worker registered:', reg.scope))
      .catch(err => console.log('Service Worker registration failed:', err));
  });
}

// PWA Install Prompt
let deferredPrompt;
const installPrompt = document.getElementById('installPrompt');
const installBtn = document.getElementById('installBtn');
const dismissBtn = document.getElementById('dismissBtn');

window.addEventListener('beforeinstallprompt', (e) => {
  e.preventDefault();
  deferredPrompt = e;
  installPrompt.classList.add('show');
});

installBtn.addEventListener('click', async () => {
  if (!deferredPrompt) return;
  deferredPrompt.prompt();
  const { outcome } = await deferredPrompt.userChoice;
  deferredPrompt = null;
  installPrompt.classList.remove('show');
});

dismissBtn.addEventListener('click', () => {
  installPrompt.classList.remove('show');
  localStorage.setItem('installDismissed', 'true');
});

if (localStorage.getItem('installDismissed') === 'true') {
  installPrompt.classList.remove('show');
}

window.addEventListener('appinstalled', () => {
  installPrompt.classList.remove('show');
});

// ========================================
// TAG MAP
// ========================================
const TAG_MAP = {

let hiddenDishes = JSON.parse(localStorage.getItem("mealHidden_v2") || "{}");
let customDishes = JSON.parse(localStorage.getItem("mealCustom_v2") || "{}");
let manageCat = null;
let addFormTags = [];

function libKey(meal, cat) { return meal + "_" + cat; }

// ========================================
// GET DISHES (active / all)
// ========================================
function getActiveDishes(meal, cat) {
  const key = libKey(meal, cat);
  const defaults = LIB[key] || [];
  const hidden = hiddenDishes[key] || [];
  const customs = (customDishes[key] || []).map(d => ({...d, _custom:true}));
  return [...defaults.filter(d => !hidden.includes(d.name)), ...customs];
}
function getAllDishes(meal, cat) {
  const key = libKey(meal, cat);
  const defaults = LIB[key] || [];
  const hidden = hiddenDishes[key] || [];
  const customs = (customDishes[key] || []).map(d => ({...d, _custom:true}));
  return [...defaults.map(d => ({...d, _hidden:hidden.includes(d.name)})), ...customs];
}

// ========================================
// DATE HELPERS
// ========================================
function dateKey(d) {
  return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
}
function dateDisplay(d) {
  const today = new Date(); today.setHours(0,0,0,0);
  const diff = Math.round((d - today) / 86400000);
  const wd = ["周日","周一","周二","周三","周四","周五","周六"][d.getDay()];
  const label = `${d.getMonth()+1}月${d.getDate()}日 ${wd}`;
  if (diff === 0) return label + "（今天）";
  if (diff === 1) return label + "（明天）";
  if (diff === -1) return label + "（昨天）";
  return label;
}

// ========================================
// RECENT HISTORY (for variety)
// ========================================
function getRecentNames(meal, days) {
  const used = {};
  const cfg = MEAL_CFG[meal];
  cfg.cats.forEach(c => used[c.k] = []);
  for (let i = 1; i <= days; i++) {
    const d = new Date(currentDate); d.setDate(d.getDate() - i);
    const k = dateKey(d);
    const dayMenu = savedMenus[k];
    if (dayMenu && dayMenu[meal]) {
      cfg.cats.forEach(c => {
        const val = dayMenu[meal][c.k];
        if (!val) return;
        if (Array.isArray(val)) val.forEach(n => used[c.k].push(n));
        else used[c.k].push(val);
      });
    }
  }
  return used;
}
function getRecentProteinSrc(meal, days) {
  const srcs = [];
  const mainCat = meal === "breakfast" ? "protein" : (meal === "lunch" ? "lmain" : "main");
  for (let i = 1; i <= days; i++) {
    const d = new Date(currentDate); d.setDate(d.getDate() - i);
    const k = dateKey(d);
    const dayMenu = savedMenus[k];
    if (dayMenu && dayMenu[meal]) {
      let names = dayMenu[meal][mainCat] || [];
      if (!Array.isArray(names)) names = [names];
      names.forEach(name => {
        const dish = (LIB[libKey(meal, mainCat)] || []).find(m => m.name === name)
          || (customDishes[libKey(meal, mainCat)] || []).find(m => m.name === name);
        if (dish && dish.proteinSrc) srcs.push(dish.proteinSrc);
      });
    }
  }
  return srcs;
}

// ========================================
// MENU GENERATION
// ========================================
function pickOne(arr, exclude) {
  let c = arr.filter(i => !exclude.includes(i.name));
  if (c.length === 0) c = arr;
  return c[Math.floor(Math.random() * c.length)];
}

// 人数 → 菜品结构（4人升级为 2主菜+2配菜+汤+主食，即"四菜一汤"）
const DINER_PLAN = {
  1: {main:1, side:1, lightMain:true},
  2: {main:1, side:1},
  3: {main:1, side:2},
  4: {main:2, side:2}
};
const DINER_HINT = {
  1: "单人份 · 一菜一汤，清淡为主",
  2: "一荤一素 + 汤 + 主食",
  3: "一荤两素 + 汤 + 主食",
  4: "双主菜 + 双配菜 + 汤 + 主食（四菜一汤）"
};
const VEG_SRC = ["tofu", "egg"];

// 从候选池中挑一道与已有菜互补的（不同蛋白源 / 不同颜色 / 不过于重口）
function pickComplement(pool, keepers, catK) {
  if (!pool || pool.length === 0) return null;
  if (!keepers || keepers.length === 0) return pool[Math.floor(Math.random()*pool.length)];
  let c = pool.slice();
  if (catK === "main" || catK === "lmain") {
    const srcs = keepers.map(d=>d.proteinSrc).filter(Boolean);
    let diff = c.filter(d => !srcs.includes(d.proteinSrc));
    if (diff.length > 0) c = diff;
    if (keepers.length && keepers.every(d => VEG_SRC.includes(d.proteinSrc))) {
      const meaty = c.filter(d => !VEG_SRC.includes(d.proteinSrc));
      if (meaty.length > 0) c = meaty;
    }
    if (keepers.some(d => d.heavy)) {
      const light = c.filter(d => !d.heavy);
      if (light.length > 0) c = light;
    }
  }
  if (catK === "side" || catK === "lside") {
    const colors = keepers.map(d=>d.color).filter(Boolean);
    let diff = c.filter(d => !colors.includes(d.color));
    if (diff.length > 0) c = diff;
  }
  return c[Math.floor(Math.random()*c.length)];
}

function generateMeal(meal, exclude) {
  exclude = exclude || {};
  const cfg = MEAL_CFG[meal];
  const recent = getRecentNames(meal, 5);
  const menu = {};

  if (meal === "breakfast") {
    // 早餐：每类1项，避开近5天重复
    cfg.cats.forEach(c => {
      const pool = getActiveDishes(meal, c.k);
      const ex = [...(recent[c.k] || []).slice(0,3), ...(exclude[c.k] || [])];
      menu[c.k] = pickOne(pool, ex);
    });
    return menu;
  }

  // 午/晚餐
  const mainCat = meal === "lunch" ? "lmain" : "main";
  const sideCat = meal === "lunch" ? "lside" : "side";
  const grainCat = meal === "lunch" ? "lgrain" : "grain";
  const soupCat = meal === "lunch" ? "lsoup" : "soup";

  const allMains = getActiveDishes(meal, mainCat);
  const allSides = getActiveDishes(meal, sideCat);
  const allGrains = getActiveDishes(meal, grainCat);
  const allSoups = getActiveDishes(meal, soupCat);
  const recentProteinSrc = getRecentProteinSrc(meal, 3);

  // 主菜（按人数 1-2 道，4人给"双主菜"）
  const plan = DINER_PLAN[dinerCount] || DINER_PLAN[2];
  let mains = [];
  let usedMainNames = [...(exclude[mainCat] || [])];
  for (let i = 0; i < plan.main; i++) {
    let cand = allMains.filter(m => !(recent[mainCat]||[]).includes(m.name) && !usedMainNames.includes(m.name));
    let pf = cand.filter(m => !recentProteinSrc.includes(m.proteinSrc));
    let pool = pf.length > 0 ? pf : cand;
    if (pool.length === 0) pool = allMains.filter(m => !usedMainNames.includes(m.name));
    if (pool.length === 0) pool = allMains.slice();
    if (plan.lightMain && i === 0) {
      const lightMains = pool.filter(m => !m.heavy);
      if (lightMains.length > 0) pool = lightMains;
    }
    const picked = pickComplement(pool, mains, mainCat);
    if (picked) { mains.push(picked); usedMainNames.push(picked.name); }
  }
  menu[mainCat] = mains;

  // 配菜（按人数 1-2 道）
  let sideCount = plan.side;
  let sides = [];
  let usedSideNames = [...(exclude[sideCat] || [])];
  for (let i = 0; i < sideCount; i++) {
    let sideCand = allSides.filter(s => !(recent[sideCat]||[]).slice(0,3).includes(s.name) && !usedSideNames.includes(s.name));
    const mainHasGreen = mains.some(m => (m.tags||[]).includes("veggie") && m.color === "green");
    if (mainHasGreen && i === 0) {
      let nonGreen = sideCand.filter(s => s.color !== "green");
      if (nonGreen.length > 0) sideCand = nonGreen;
    } else if (!mainHasGreen && i === 0) {
      let greenOnes = sideCand.filter(s => s.color === "green");
      if (greenOnes.length > 0 && Math.random() > 0.3) sideCand = greenOnes;
    }
    if (mains.some(m => m.heavy) && i === 0) {
      let lightSides = sideCand.filter(s => (s.tags||[]).includes("quick"));
      if (lightSides.length > 0) sideCand = lightSides;
    }
    if (i === 1 && sides.length > 0) {
      let diffColor = sideCand.filter(s => s.color !== sides[0].color);
      if (diffColor.length > 0) sideCand = diffColor;
    }
    if (sideCand.length === 0) sideCand = allSides.filter(s => !usedSideNames.includes(s.name));
    if (sideCand.length === 0) sideCand = allSides;
    const picked = sideCand[Math.floor(Math.random()*sideCand.length)];
    if (picked) { sides.push(picked); usedSideNames.push(picked.name); }
  }
  menu[sideCat] = sides;

  // 汤
  let soupCand = allSoups.filter(s => !(recent[soupCat]||[]).slice(0,3).includes(s.name));
  if (exclude[soupCat]) soupCand = soupCand.filter(s => s.name !== exclude[soupCat]);
  if (mains.some(m => m.heavy)) {
    let lightSoups = soupCand.filter(s => (s.tags||[]).includes("light"));
    if (lightSoups.length > 0) soupCand = lightSoups;
  }
  if (mains.some(m => m.flavor==="辣"||m.flavor==="微辣")) {
    let nonSpicy = soupCand.filter(s => s.flavor!=="辣" && s.flavor!=="微辣");
    if (nonSpicy.length > 0) soupCand = nonSpicy;
  }
  if (soupCand.length === 0) soupCand = allSoups;
  menu[soupCat] = soupCand[Math.floor(Math.random()*soupCand.length)];

  // 主食
  let grainCand = allGrains.filter(g => !(recent[grainCat]||[]).slice(0,3).includes(g.name));
  if (exclude[grainCat]) grainCand = grainCand.filter(g => g.name !== exclude[grainCat]);
  if (mains.some(m => m.flavor==="清淡") && Math.random()>0.5) {
    let mixed = grainCand.filter(g => g.grain==="mixed");
    if (mixed.length > 0) grainCand = mixed;
  }
  if (grainCand.length === 0) grainCand = allGrains;
  menu[grainCat] = grainCand[Math.floor(Math.random()*grainCand.length)];

  return menu;
}

// ========================================
// NUTRITION
// ========================================
function calcBreakfastNutrition(menu) {
  const cfg = MEAL_CFG.breakfast;
  const res = {slowcarb:0, choline:0, omega3:0, antiox:0, protein:0};
  cfg.cats.forEach(c => {
    const dish = menu[c.k];
    if (!dish) return;
    (dish.nut || []).forEach(n => {
      const pot = (dish.pot && dish.pot[n]) ? dish.pot[n] : 70;
      if (res[n] !== undefined) res[n] = Math.max(res[n], pot);
    });
  });
  Object.keys(res).forEach(k => res[k] = Math.min(100, Math.round(res[k])));
  return res;
}

function calcMealNutrition(meal, menu) {
  if (meal === "breakfast") return calcBreakfastNutrition(menu);
  let p = 0, v = 0, s = 0;
  const mainCat = meal === "lunch" ? "lmain" : "main";
  const sideCat = meal === "lunch" ? "lside" : "side";
  const grainCat = meal === "lunch" ? "lgrain" : "grain";
  const soupCat = meal === "lunch" ? "lsoup" : "soup";
  const mains = menu[mainCat] || [];
  const sides = menu[sideCat] || [];
  const soup = menu[soupCat];
  const grain = menu[grainCat];

  mains.forEach(m => {
    if ((m.tags||[]).includes("protein")) p += dinerCount <= 1 ? 40 : 45;
    if (m.proteinSrc && ["beef","pork","fish"].includes(m.proteinSrc)) p += 15;
    else if (m.proteinSrc==="chicken") p += 10;
    else if (m.proteinSrc==="seafood") p += 12;
    else if (m.proteinSrc==="tofu") p += 8;
    else if (m.proteinSrc==="egg") p += 6;
    if (m.proteinSrc) p += 5;
  });
  if (soup && (soup.tags||[]).includes("protein")) p += 8;
  p = Math.min(100, p);

  mains.forEach(m => { if ((m.tags||[]).includes("veggie")) v += 12; });
  v += sides.length * 25;
  sides.forEach(si => { if ((si.tags||[]).includes("quick")) v += 8; });
  v += 12;
  if (grain && (grain.tags||[]).includes("veggie")) v += 8;
  v = Math.min(100, v);

  s = (grain && ((grain.tags||[]).includes("mixed") || grain.grain==="mixed")) ? 72 : 68;
  if (mains.some(m => (m.tags||[]).includes("staple"))) s += 8;
  s = Math.min(100, s);

  return {protein:Math.round(p), veggie:Math.round(v), staple:Math.round(s)};
}

function totalCombos(meal) {
  const cfg = MEAL_CFG[meal];
  let total = 1;
  cfg.cats.forEach(c => {
    const n = getActiveDishes(meal, c.k).length;
    if (c.multi && (meal === "lunch" || meal === "dinner")) {
      total *= (c.k.includes("side") ? (dinerCount <= 2 ? n : n * Math.max(1, n-1)) : n);
    } else {
      total *= n;
    }
  });
  return total;
}

// ========================================
// RENDER
// ========================================
function renderTags(dish) {
  const tags = dish.nut || dish.tags || [];
  return tags.map(t => {
    const info = TAG_MAP[t]; if (!info) return '';
    return `<span class="tag ${info.cls}">${info.label}</span>`;
  }).join('');
}

function renderMenuItem(cat, dish, idx, swapLabel) {
  if (!dish) return '';
  const badge = dish._custom ? '<span style="font-size:10px;color:#534AB7;border:1px solid #AFA9EC;background:#EEEDFE;padding:1px 5px;border-radius:10px;margin-left:6px;">自选</span>' : '';
  return `<div class="menu-item">
    <div class="item-info">
      <div class="item-name">${cat.icon} ${dish.name} <span style="font-size:12px;color:#b4b2a9;font-weight:400;">${cat.n}</span>${badge}</div>
      <div class="item-desc">${dish.desc}</div>
      <div class="item-tags">${renderTags(dish)}</div>
    </div>
    <button class="item-swap-btn" onclick="swapOne('${cat.k}',${idx})">${swapLabel}</button>
  </div>`;
}

function renderMenu(meal, menu) {
  const cfg = MEAL_CFG[meal];
  let items = [];
  cfg.cats.forEach(c => {
    const val = menu[c.k];
    if (c.multi && Array.isArray(val)) {
      val.forEach((dish, i) => {
        const role = val.length > 1 ? (c.n + (i===0?"①":"②")) : c.n;
        items.push(`<div class="menu-item">
          <div class="item-info">
            <div class="item-name">${c.icon} ${dish.name} <span style="font-size:12px;color:#b4b2a9;font-weight:400;">${role}</span>${dish._custom?'<span style="font-size:10px;color:#534AB7;border:1px solid #AFA9EC;background:#EEEDFE;padding:1px 5px;border-radius:10px;margin-left:6px;">自选</span>':''}</div>
            <div class="item-desc">${dish.desc}</div>
            <div class="item-tags">${renderTags(dish)}</div>
          </div>
          <button class="item-swap-btn" onclick="swapOne('${c.k}',${i})">换${c.n}</button>
        </div>`);
      });
    } else if (val) {
      items.push(renderMenuItem(c, val, 0, "换" + c.n));
    }
  });
  return items.join('');
}

function renderNutrition(meal, nut) {
  const cfg = MEAL_CFG[meal];
  const bars = cfg.nut.map(k => ({
    label: NUT_META[k].label, value: nut[k] || 0, fill: NUT_META[k].fill
  }));
  const avg = Math.round(bars.reduce((s,b)=>s+b.value,0) / bars.length);
  let scoreColor = avg>=68?"#0F6E56":avg>=55?"#BA7517":"#E24B4A";
  let scoreText = avg>=68?"营养均衡":avg>=55?"基本达标":"建议调整";

  let hint = '';
  if (meal === "breakfast") {
    const missing = cfg.nut.filter(k => (nut[k]||0) < 55).map(k => NUT_META[k].label);
    if (missing.length) hint = `💡 偏弱：${missing.join("、")}。可换一道对应的菜补上（如胆碱不足就选鸡蛋/蛋黄）。`;
  }

  return `<div style="background:#fff;border-radius:16px;border:.5px solid rgba(0,0,0,.12);padding:16px 20px;">
    <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:12px;">
      <span style="font-size:13px;color:#888780;">营养评估</span>
      <span style="font-size:13px;font-weight:500;color:${scoreColor};">${scoreText}</span>
    </div>
    ${bars.map(b=>`<div class="nut-row"><span class="nut-label">${b.label}</span><div class="nut-track"><div class="nut-fill ${b.fill}" style="width:${b.value}%"></div></div><span class="nut-value">${b.value}%</span></div>`).join('')}
    ${hint?`<div class="nut-hint">${hint}</div>`:''}
  </div>`;
}

function updateUI() {
  closeSidePanel('shopPanel'); closeSidePanel('sharePanel');
  const meal = currentMeal;
  const cfg = MEAL_CFG[meal];

  // meal tabs
  document.querySelectorAll(".meal-tab").forEach(b => {
    b.classList.toggle("active", b.dataset.meal === meal);
  });

  // brain tip
  const tipEl = document.getElementById("brainTip");
  tipEl.style.display = "block";
  document.getElementById("brainTipText").textContent = cfg.tip;
  document.querySelector(".brain-tip-title").textContent = `${cfg.icon} ${meal==="breakfast"?"黄翔博士 · 早餐「五大金刚」":(meal==="lunch"?"午餐 · 承上启下":"黄翔博士 · 晚餐补蛋白")}`;

  document.getElementById("dateLabel").textContent = dateDisplay(currentDate);
  document.getElementById("menuSectionLabel").textContent = `今日${cfg.name}菜单`;

  // diner buttons
  document.querySelectorAll(".diner-btn").forEach(b => {
    b.classList.toggle("active", parseInt(b.dataset.n) === dinerCount);
  });
  const dinHintEl = document.getElementById("dinerHint");
  if (dinHintEl) {
    dinHintEl.textContent = meal === "breakfast"
      ? "早餐按人头增减份量即可（每人一份组合）"
      : (DINER_HINT[dinerCount] || DINER_HINT[2]);
  }

  const key = dateKey(currentDate);
  const dayMenu = savedMenus[key];
  if (dayMenu && dayMenu[meal]) {
    // 已从历史恢复
    currentMenu = {};
    cfg.cats.forEach(c => {
      const val = dayMenu[meal][c.k];
      if (val == null) return;
      const pool = [...(LIB[libKey(meal,c.k)]||[]), ...(customDishes[libKey(meal,c.k)]||[])];
      if (Array.isArray(val)) {
        currentMenu[c.k] = val.map(n => pool.find(d=>d.name===n)).filter(Boolean);
      } else {
        currentMenu[c.k] = pool.find(d=>d.name===val) || null;
      }
    });
    if (dayMenu[meal].diners) dinerCount = dayMenu[meal].diners;
  } else if (!currentMenu || Object.keys(currentMenu).length === 0) {
    currentMenu = generateMeal(meal);
  }

  const mc = document.getElementById("menuContent");
  mc.innerHTML = renderMenu(meal, currentMenu);
  mc.classList.remove("fade-in"); void mc.offsetWidth; mc.classList.add("fade-in");

  document.getElementById("nutritionBar").innerHTML = renderNutrition(meal, calcMealNutrition(meal, currentMenu));

  const counts = cfg.cats.map(c => `${getActiveDishes(meal,c.k).length}道${c.n}`).join(" / ");
  document.getElementById("comboCount").textContent = `${totalCombos(meal).toLocaleString()} 种搭配 · ${counts}`;

  const badge = document.getElementById("savedBadge");
  if (dayMenu && dayMenu[meal]) { badge.textContent=`已保存这天的${cfg.name}`; badge.style.display="block"; }
  else { badge.style.display="none"; }

  if (document.getElementById("managePanel").classList.contains("open")) renderManageList();
}

// ========================================
// INTERACTIONS
// ========================================
function setMeal(m) {
  if (currentMeal === m) return;
  currentMeal = m;
  localStorage.setItem("mealCurrent", m);
  currentMenu = {};
  manageCat = null;
  updateUI();
}

function setDiners(n) {
  dinerCount = n;
  localStorage.setItem("mealDiners", String(n));
  const key = dateKey(currentDate);
  const dayMenu = savedMenus[key];
  if (!dayMenu || !dayMenu[currentMeal]) {
    currentMenu = generateMeal(currentMeal);
  }
  updateUI();
}

function currentExclude() {
  const cfg = MEAL_CFG[currentMeal];
  const ex = {};
  cfg.cats.forEach(c => {
    const val = currentMenu[c.k];
    if (Array.isArray(val)) ex[c.k] = val.map(d=>d.name);
    else if (val) ex[c.k] = val.name;
  });
  return ex;
}

function swapOne(catK, idx) {
  const dKey = dateKey(currentDate);
  if (savedMenus[dKey] && savedMenus[dKey][currentMeal]) { alert("这天已确认菜单，不能更换。"); return; }
  const newMenu = generateMeal(currentMeal, currentExclude());
  const val = currentMenu[catK];
  if (Array.isArray(val)) {
    const keep = val.filter((d, i) => i !== idx && d);
    const keepNames = keep.map(d => d.name);
    const curNames = val.map(d => d && d.name);
    let pool = (newMenu[catK]||[]).filter(d => d && !curNames.includes(d.name) && !keepNames.includes(d.name));
    if (pool.length === 0) pool = (newMenu[catK]||[]).filter(d => d && !keepNames.includes(d.name));
    if (pool.length === 0) pool = (newMenu[catK]||[]).slice();
    const nd = pickComplement(pool, keep, catK) || (newMenu[catK]||[])[0];
    currentMenu[catK][idx] = nd;
  } else {
    currentMenu[catK] = newMenu[catK];
  }
  refreshMenuView();
}

function rerollAll() {
  const dKey = dateKey(currentDate);
  if (savedMenus[dKey] && savedMenus[dKey][currentMeal]) { alert("这天已确认菜单，不能更换。"); return; }
  currentMenu = generateMeal(currentMeal, currentExclude());
  refreshMenuView();
}

function refreshMenuView() {
  closeSidePanel('shopPanel'); closeSidePanel('sharePanel');
  const mc = document.getElementById("menuContent");
  mc.classList.add("shake");
  setTimeout(()=>mc.classList.remove("shake"),400);
  setTimeout(()=>{
    mc.innerHTML = renderMenu(currentMeal, currentMenu);
    mc.classList.remove("fade-in"); void mc.offsetWidth; mc.classList.add("fade-in");
    document.getElementById("nutritionBar").innerHTML = renderNutrition(currentMeal, calcMealNutrition(currentMeal, currentMenu));
  },200);
}

function changeDate(delta) {
  const d = new Date(currentDate); d.setDate(d.getDate()+delta);
  currentDate = d;
  currentMenu = {};
  updateUI();
}

function saveMenu() {
  const key = dateKey(currentDate);
  if (!savedMenus[key]) savedMenus[key] = {};
  const cfg = MEAL_CFG[currentMeal];
  const rec = {diners: dinerCount};
  cfg.cats.forEach(c => {
    const val = currentMenu[c.k];
    if (Array.isArray(val)) rec[c.k] = val.map(d=>d.name);
    else if (val) rec[c.k] = val.name;
  });
  savedMenus[key][currentMeal] = rec;
  localStorage.setItem("mealHistory_v3", JSON.stringify(savedMenus));
  const badge = document.getElementById("savedBadge");
  badge.textContent = `已保存！这天的${cfg.name}就吃这个了`;
  badge.style.display = "block";
}

function showHistory() {
  const section = document.getElementById("historySection");
  section.style.display = section.style.display==="none"?"block":"none";
  if (section.style.display==="block") renderHistory();
}

// ========================================
// SHOPPING LIST
// ========================================
const STAPLE_ING = ["蒜","姜","葱","生抽","老抽","冰糖","白醋","料酒","淀粉","盐","油","番茄酱","郫县豆瓣","味噌","咖喱块","照烧酱","辣椒油","干辣椒","黑胡椒","香菜","青蒜","蒜苗","剁椒"];
const DRY_ING = ["大米","小米","糙米","藜麦","玉米面","面条","馒头","全麦吐司","全麦馒头","全麦卷饼","黄豆","绿豆","薏米","银耳","枸杞","虾皮","紫菜","海带","干木耳","干香菇","粉丝","燕麦片","黑芝麻","核桃","杏仁","腰果","亚麻籽","花生米"];
// CPS 联盟位：把 {kw} 换成你的联盟搜索链接即可变现（如京东联盟/多多进宝/美团分销）
const BUY_LINK_TPL = "https://maicai.meituan.com/search?keyword={kw}";

function dishIngredients(dish) {
  if (!dish) return [];
  if (dish.ing && dish.ing.length) return dish.ing;
  return INGREDIENTS[dish.name] || [];
}

function buildShoppingList() {
  const cfg = MEAL_CFG[currentMeal];
  const map = {};
  cfg.cats.forEach(c => {
    const val = currentMenu[c.k];
    const dishes = Array.isArray(val) ? val : (val ? [val] : []);
    dishes.forEach(d => {
      if (!d) return;
      dishIngredients(d).forEach(ing => {
        if (!map[ing]) map[ing] = [];
        if (map[ing].indexOf(d.name) < 0) map[ing].push(d.name);
      });
    });
  });
  const fresh = [], dry = [], staple = [];
  Object.keys(map).forEach(name => {
    const item = { name: name, from: map[name] };
    if (STAPLE_ING.indexOf(name) >= 0) staple.push(item);
    else if (DRY_ING.indexOf(name) >= 0) dry.push(item);
    else fresh.push(item);
  });
  return { fresh: fresh, dry: dry, staple: staple };
}

let shopChecked = {};
function shopKey() { return dateKey(currentDate) + "_" + currentMeal + "_" + dinerCount; }
function loadShopChecked() {
  let all = {};
  try { all = JSON.parse(localStorage.getItem("mealShopChecked") || "{}"); } catch (e) { all = {}; }
  shopChecked = all[shopKey()] || {};
}
function saveShopChecked() {
  let all = {};
  try { all = JSON.parse(localStorage.getItem("mealShopChecked") || "{}"); } catch (e) { all = {}; }
  all[shopKey()] = shopChecked;
  localStorage.setItem("mealShopChecked", JSON.stringify(all));
}
function isShopChecked(it, def) {
  const v = shopChecked[it.name];
  return v === undefined ? def : v;
}
function toggleShopItem(name) {
  const g = buildShoppingList();
  let def = false;
  g.dry.concat(g.staple).forEach(i => { if (i.name === name) def = true; });
  shopChecked[name] = !isShopChecked({ name: name }, def);
  saveShopChecked();
  renderShopList();
}
function slGroupHTML(title, items, defaultChecked) {
  if (!items.length) return '';
  return '<div class="sl-group-title">' + title + '</div>' + items.map(it => {
    const ck = isShopChecked(it, defaultChecked);
    return '<div class="sl-item ' + (ck ? 'checked' : '') + '" onclick="toggleShopItem(\'' + it.name + '\')">' +
      '<span class="dot">' + (ck ? '✓' : '') + '</span><span class="nm">' + it.name + '</span>' +
      '<span class="from">' + it.from.join('、') + '</span></div>';
  }).join('');
}
function renderShopList() {
  const g = buildShoppingList();
  const total = g.fresh.length + g.dry.length + g.staple.length;
  let html = '<div class="panel-head"><b>今日买菜清单</b><span class="panel-close" onclick="closeSidePanel(\'shopPanel\')">关闭</span></div>';
  if (!total) {
    html += '<p class="panel-tip">当前菜单还没识别到食材。自定义菜品可在编辑菜品库时补上食材。</p>';
  } else {
    html += slGroupHTML('要买的（生鲜 · 蛋奶 · 果蔬）', g.fresh, false);
    html += slGroupHTML('米面干货（查下家里存量）', g.dry, true);
    html += slGroupHTML('调料辛香料（基本都有）', g.staple, true);
    html += '<div class="sl-actions"><button onclick="copyShopList()">复制清单</button>' +
      '<button class="primary" onclick="openBuyLink()">去下单</button></div>';
  }
  document.getElementById('shopPanel').innerHTML = html;
}
function needBuyList() {
  const g = buildShoppingList();
  const need = [];
  g.fresh.forEach(it => { if (!isShopChecked(it, false)) need.push(it.name); });
  g.dry.forEach(it => { if (!isShopChecked(it, true)) need.push(it.name); });
  g.staple.forEach(it => { if (!isShopChecked(it, true)) need.push(it.name); });
  return need;
}
function toggleShopList() {
  const p = document.getElementById('shopPanel');
  if (p.classList.contains('open')) { p.classList.remove('open'); return; }
  loadShopChecked();
  renderShopList();
  p.classList.add('open');
  p.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
}
function closeSidePanel(id) { document.getElementById(id).classList.remove('open'); }
function copyShopList() {
  const need = needBuyList();
  const text = need.length
    ? ('今日' + MEAL_CFG[currentMeal].name + '买菜清单：' + need.join('、'))
    : '家里都齐了，今天不用买菜';
  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(text).then(function () {
      alert('已复制，去买菜 App 粘贴即可：\n\n' + text);
    }).catch(function () { prompt('复制这段去下单：', text); });
  } else {
    prompt('复制这段去下单：', text);
  }
}
function openBuyLink() {
  const need = needBuyList();
  const kw = need.length ? need[0] : '生鲜';
  window.open(BUY_LINK_TPL.replace('{kw}', encodeURIComponent(kw)), '_blank');
}

// ========================================
// SHARE CARD
// ========================================
function rrect(ctx, x, y, w, h, r) {
  ctx.beginPath();
  ctx.moveTo(x + r, y); ctx.lineTo(x + w - r, y); ctx.quadraticCurveTo(x + w, y, x + w, y + r);
  ctx.lineTo(x + w, y + h - r); ctx.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
  ctx.lineTo(x + r, y + h); ctx.quadraticCurveTo(x, y + h, x, y + h - r);
  ctx.lineTo(x, y + r); ctx.quadraticCurveTo(x, y, x + r, y); ctx.closePath();
}
function clipText(ctx, text, maxW) {
  if (!text) return '';
  if (ctx.measureText(text).width <= maxW) return text;
  let t = text;
  while (t.length > 1 && ctx.measureText(t + '…').width > maxW) t = t.slice(0, -1);
  return t + '…';
}
const CARD_FONT = '"PingFang SC","Microsoft YaHei","Hiragino Sans GB",sans-serif';

function buildShareCard() {
  const cfg = MEAL_CFG[currentMeal];
  const items = [];
  cfg.cats.forEach(c => {
    const val = currentMenu[c.k];
    const ds = Array.isArray(val) ? val : (val ? [val] : []);
    ds.forEach(d => { if (d) items.push({ icon: c.icon, cat: c.n, name: d.name, desc: d.desc || '' }); });
  });
  const W = 600, PAD = 40, HEAD = 168, ITEM_H = 88, GAP = 10;
  const H = HEAD + 24 + items.length * (ITEM_H + GAP) + 20 + 64 + 26 + 46;
  const cv = document.createElement('canvas');
  const dpr = 2;
  cv.width = W * dpr; cv.height = H * dpr;
  const ctx = cv.getContext('2d');
  ctx.scale(dpr, dpr);
  ctx.fillStyle = '#FFFFFF'; ctx.fillRect(0, 0, W, H);

  ctx.fillStyle = '#534AB7'; ctx.fillRect(0, 0, W, HEAD);
  ctx.fillStyle = '#FFFFFF';
  ctx.font = '500 34px ' + CARD_FONT;
  ctx.fillText('今日' + cfg.name + '吃什么', PAD, 76);
  ctx.fillStyle = 'rgba(255,255,255,.78)';
  ctx.font = '400 20px ' + CARD_FONT;
  ctx.fillText(dateDisplay(currentDate) + ' · ' + dinerCount + '人份 · ' + items.length + '道', PAD, 114);
  ctx.fillStyle = 'rgba(255,255,255,.55)';
  ctx.font = '400 18px ' + CARD_FONT;
  ctx.fillText('三餐帮手 · 智能搭配 常换常新', PAD, 148);

  let y = HEAD + 24;
  items.forEach(it => {
    ctx.fillStyle = '#F7F6F3';
    rrect(ctx, PAD, y, W - 2 * PAD, ITEM_H, 14); ctx.fill();
    ctx.fillStyle = '#2C2C2A';
    ctx.font = '30px ' + CARD_FONT;
    ctx.fillText(it.icon, PAD + 18, y + 57);
    ctx.font = '500 24px ' + CARD_FONT;
    ctx.fillStyle = '#2C2C2A';
    ctx.fillText(clipText(ctx, it.name, W - 2 * PAD - 200), PAD + 68, y + 41);
    ctx.font = '400 17px ' + CARD_FONT;
    ctx.fillStyle = '#888780';
    ctx.fillText(clipText(ctx, it.desc, W - 2 * PAD - 200), PAD + 68, y + 68);
    ctx.font = '400 16px ' + CARD_FONT;
    ctx.fillStyle = '#B4B2A9';
    ctx.textAlign = 'right';
    ctx.fillText(it.cat, W - PAD - 18, y + 52);
    ctx.textAlign = 'left';
    y += ITEM_H + GAP;
  });

  const nut = calcMealNutrition(currentMeal, currentMenu);
  let sum = 0;
  cfg.nut.forEach(k => { sum += (nut[k] || 0); });
  const avg = cfg.nut.length ? Math.round(sum / cfg.nut.length) : 0;
  const scoreColor = avg >= 68 ? '#0F6E56' : (avg >= 55 ? '#BA7517' : '#E24B4A');
  ctx.fillStyle = '#F7F6F3';
  rrect(ctx, PAD, y, W - 2 * PAD, 64, 14); ctx.fill();
  ctx.font = '400 18px ' + CARD_FONT;
  ctx.fillStyle = '#888780';
  ctx.fillText('营养评估', PAD + 20, y + 38);
  ctx.font = '500 26px ' + CARD_FONT;
  ctx.fillStyle = scoreColor;
  ctx.fillText(avg + '分', PAD + 116, y + 40);
  const bx = PAD + 186, bw = W - 2 * PAD - 206, by = y + 27;
  ctx.fillStyle = '#E8E6DF';
  rrect(ctx, bx, by, bw, 10, 5); ctx.fill();
  ctx.fillStyle = scoreColor;
  rrect(ctx, bx, by, Math.max(8, bw * avg / 100), 10, 5); ctx.fill();

  y += 64 + 26;
  ctx.font = '400 17px ' + CARD_FONT;
  ctx.fillStyle = '#B4B2A9';
  ctx.textAlign = 'center';
  ctx.fillText('每天不重样 · 营养看得见', W / 2, y + 16);
  ctx.textAlign = 'left';
  return cv.toDataURL('image/png');
}

function toggleShareCard() {
  const p = document.getElementById('sharePanel');
  if (p.classList.contains('open')) { p.classList.remove('open'); return; }
  const url = buildShareCard();
  window.__shareURL = url;
  p.innerHTML = '<div class="panel-head"><b>分享卡片</b><span class="panel-close" onclick="closeSidePanel(\'sharePanel\')">关闭</span></div>' +
    '<img class="share-img" src="' + url + '" alt="今日菜单卡片">' +
    '<div class="sl-actions"><button onclick="downloadShare()">保存 / 下载</button>' +
    '<button class="primary" onclick="copyShareText()">复制文字版</button></div>' +
    '<p class="panel-tip">手机上长按图片即可保存到相册，发朋友圈或家长群最好用。</p>';
  p.classList.add('open');
  p.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
}
function downloadShare() {
  if (!window.__shareURL) return;
  const a = document.createElement('a');
  a.href = window.__shareURL;
  a.download = '今日' + MEAL_CFG[currentMeal].name + '.png';
  document.body.appendChild(a); a.click(); a.remove();
}
function copyShareText() {
  const cfg = MEAL_CFG[currentMeal];
  const lines = ['【今日' + cfg.name + '】' + dateDisplay(currentDate) + ' · ' + dinerCount + '人份'];
  cfg.cats.forEach(c => {
    const val = currentMenu[c.k];
    const ds = Array.isArray(val) ? val : (val ? [val] : []);
    ds.forEach(d => { if (d) lines.push(c.icon + ' ' + c.n + '：' + d.name); });
  });
  lines.push('—— 三餐帮手 · 智能搭配');
  const text = lines.join('\n');
  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(text).then(function () { alert('已复制文字版菜单'); })
      .catch(function () { prompt('复制这段：', text); });
  } else {
    prompt('复制这段：', text);
  }
}

function renderHistory() {
  const list = document.getElementById("historyList");
  const entries = Object.entries(savedMenus).sort((a,b)=>b[0].localeCompare(a[0])).slice(0,7);
  if (!entries.length) { list.innerHTML='<li style="color:#b4b2a9;justify-content:center;">暂无记录</li>'; return; }
  list.innerHTML = entries.map(([date, dayMenu]) => {
    const rows = Object.keys(dayMenu).filter(m => MEAL_CFG[m]).map(m => {
      const cfg = MEAL_CFG[m];
      const rec = dayMenu[m];
      const parts = [];
      cfg.cats.forEach(c => {
        const val = rec[c.k];
        if (val == null) return;
        if (Array.isArray(val)) parts.push(val.join("+"));
        else parts.push(val);
      });
      return `<div class="h-meal-row"><span class="h-meal-tag">${cfg.icon}</span><span class="h-menu">${parts.join(" / ")}</span></div>`;
    }).join('');
    return `<li><span class="h-date">${date}</span><span class="h-meals">${rows}</span></li>`;
  }).join('');
}

// ========================================
// MANAGE PANEL
// ========================================
function toggleManage() {
  const panel = document.getElementById("managePanel");
  panel.classList.toggle("open");
  if (panel.classList.contains("open")) {
    const cfg = MEAL_CFG[currentMeal];
    if (!manageCat || !cfg.cats.some(c=>c.k===manageCat)) manageCat = cfg.cats[0].k;
    renderManageTabs();
    renderManageList();
    renderAddForm();
  }
}

function renderManageTabs() {
  const cfg = MEAL_CFG[currentMeal];
  document.getElementById("mpTitle").textContent = `${cfg.icon} ${cfg.name}菜品库`;
  document.getElementById("mpTabs").innerHTML = cfg.cats.map(c =>
    `<div class="mp-tab ${c.k===manageCat?'active':''}" data-cat="${c.k}" onclick="switchManageCat('${c.k}')">${c.n}</div>`
  ).join('');
}

function switchManageCat(k) {
  manageCat = k;
  addFormTags = [];
  renderManageTabs();
  renderManageList();
  renderAddForm();
}

function renderManageList() {
  if (!manageCat) return;
  const dishes = getAllDishes(currentMeal, manageCat);
  const key = libKey(currentMeal, manageCat);
  const list = document.getElementById("mpDishList");
  list.innerHTML = dishes.map((d,i) => {
    const isOn = !d._hidden;
    const isCustom = !!d._custom;
    return `<div class="mp-dish">
      <div class="mp-dish-info">
        <div class="mp-dish-name ${isOn?'':'hidden-dish'}">${d.name}${isCustom?'<span class="custom-badge">自定义</span>':''}</div>
        <div class="mp-dish-desc">${d.desc}</div>
      </div>
      ${isCustom ? `<button class="mp-del-btn" onclick="deleteCustom('${key}',${i})">删除</button>` : `<button class="mp-toggle ${isOn?'on':'off'}" onclick="toggleDish('${key}','${d.name}',this)"></button>`}
    </div>`;
  }).join('');
}

function toggleDish(key, name, btn) {
  if (!hiddenDishes[key]) hiddenDishes[key] = [];
  const hidden = hiddenDishes[key];
  const idx = hidden.indexOf(name);
  if (idx >= 0) hidden.splice(idx, 1);
  else hidden.push(name);
  localStorage.setItem("mealHidden_v2", JSON.stringify(hiddenDishes));
  btn.classList.toggle("on", idx < 0);
  btn.classList.toggle("off", idx >= 0);
  const nameEl = btn.closest(".mp-dish").querySelector(".mp-dish-name");
  nameEl.classList.toggle("hidden-dish", idx < 0);
  updateComboCount();
}

function deleteCustom(key, idx) {
  if (!confirm("确定删除这个自定义菜品？")) return;
  customDishes[key].splice(idx, 1);
  localStorage.setItem("mealCustom_v2", JSON.stringify(customDishes));
  renderManageList();
  updateComboCount();
}

function updateComboCount() {
  const cfg = MEAL_CFG[currentMeal];
  const counts = cfg.cats.map(c => `${getActiveDishes(currentMeal,c.k).length}道${c.n}`).join(" / ");
  document.getElementById("comboCount").textContent = `${totalCombos(currentMeal).toLocaleString()} 种搭配 · ${counts}`;
}

function renderAddForm() {
  if (!manageCat) return;
  const cat = MEAL_CFG[currentMeal].cats.find(c=>c.k===manageCat);
  // 可用标签：该餐相关的营养/特点标签
  let tagOpts;
  if (currentMeal === "breakfast") {
    tagOpts = ["slowcarb","choline","omega3","antiox","protein","staple"];
  } else if (manageCat === cat.k && (cat.k.includes("main"))) {
    tagOpts = ["protein","veggie","staple","iron"];
  } else if (cat.k.includes("side")) {
    tagOpts = ["veggie","protein","quick","staple","iron"];
  } else if (cat.k.includes("soup")) {
    tagOpts = ["light","protein","staple"];
  } else {
    tagOpts = ["staple","veggie","light"];
  }
  document.getElementById("addTags").innerHTML = tagOpts.map(t =>
    `<button class="mp-tag-opt" data-tag="${t}" onclick="toggleAddTag(this,'${t}')">${TAG_MAP[t]?TAG_MAP[t].label:t}</button>`
  ).join('');
}

function toggleAddTag(btn, tag) {
  const idx = addFormTags.indexOf(tag);
  if (idx >= 0) { addFormTags.splice(idx,1); btn.classList.remove("sel"); }
  else { addFormTags.push(tag); btn.classList.add("sel"); }
}

function addCustomDish() {
  const name = document.getElementById("addName").value.trim();
  const desc = document.getElementById("addDesc").value.trim();
  if (!name) { alert("请输入菜品名称"); return; }
  if (!desc) { alert("请输入菜品简介"); return; }
  const key = libKey(currentMeal, manageCat);
  if (!customDishes[key]) customDishes[key] = [];
  const ingEl = document.getElementById("addIng");
  const ingRaw = ingEl ? ingEl.value.trim() : "";
  const ing = ingRaw ? ingRaw.split(/[,，、\s]+/).filter(Boolean) : [];
  const dish = {name, desc, ing, tags:[...addFormTags], nut:[...addFormTags]};
  customDishes[key].push(dish);
  localStorage.setItem("mealCustom_v2", JSON.stringify(customDishes));
  document.getElementById("addName").value = "";
  document.getElementById("addDesc").value = "";
  if (ingEl) ingEl.value = "";
  addFormTags = [];
  document.querySelectorAll(".mp-tag-opt").forEach(b => b.classList.remove("sel"));
  renderManageList();
  updateComboCount();
}

// ========================================
// INIT
// ========================================
updateUI();
</script>
